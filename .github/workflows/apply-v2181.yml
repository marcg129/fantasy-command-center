name: Apply v2.18.1 streamer fix

on:
  push:
    paths:
      - 'scripts/apply_v2181.py'
      - '.github/workflows/apply-v2181.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v2.18.1
        run: python scripts/apply_v2181.py
      - name: Run Weekly regression contract
        run: python tests/weekly_contract_test.py
      - name: Commit v2.18.1
        run: |
          if git diff --quiet -- index.html CHANGELOG.md; then
            echo 'No v2.18.1 app changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md
          git commit -m 'Fix Streamer Finder candidate pool'
          git pull --rebase origin main
          git push
