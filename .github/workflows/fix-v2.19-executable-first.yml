name: Fix v2.19 Executable First

on:
  push:
    branches: [feature/v2.19-transaction-priority-queue]
    paths:
      - 'scripts/fix_v2_19_executable_first.py'
      - '.github/workflows/fix-v2.19-executable-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.19-transaction-priority-queue
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply executable-first fix
        run: python scripts/fix_v2_19_executable_first.py
      - name: Verify Weekly contract
        run: python tests/weekly_contract_test.py
      - name: Verify Streamer handoff contract
        run: python tests/streamer_waiver_handoff_test.py
      - name: Verify Transaction Priority behavior
        run: python tests/weekly_transaction_priority_test.py
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Prioritize executable transactions'
          git push origin HEAD:feature/v2.19-transaction-priority-queue
