name: Apply v2.14.x updates

on:
  push:
    paths:
      - ".github/workflows/apply-v214x.yml"

permissions:
  contents: write

concurrency:
  group: apply-v214x-updates
  cancel-in-progress: false

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply v2.14.1 positional coverage
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v2141.patch
          git apply --check /tmp/v2141.patch
          git apply /tmp/v2141.patch
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          assert 'v2.14.1' in t
          assert 'POSITIONAL COVERAGE PRIORITY' in t
          assert 'function positionalCoverageNeeds' in t
          Path('/tmp/v2141.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',t,re.S)),encoding='utf-8')
          PY
          node --check /tmp/v2141.js
          git add index.html CHANGELOG.md
          git commit -m "Add positional coverage logic"

      - name: Apply v2.14.2 league median intelligence
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v2142.patch
          git apply --check /tmp/v2142.patch
          git apply /tmp/v2142.patch
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          assert 'v2.14.2' in t
          assert 'function leagueMedianConfigured' in t
          assert 'function renderLeagueMedian' in t
          assert 'POSITIONAL COVERAGE PRIORITY' in t
          Path('/tmp/v2142.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',t,re.S)),encoding='utf-8')
          PY
          node --check /tmp/v2142.js
          git add index.html CHANGELOG.md
          git commit -m "Add league median intelligence"

      - name: Push feature commits
        shell: bash
        run: git push origin HEAD:main
