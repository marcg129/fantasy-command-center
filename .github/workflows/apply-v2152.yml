name: Apply v2.15.2 weekly simulation

on:
  push:
    paths:
      - ".github/workflows/apply-v2152.yml"

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply v2.15.2
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          payload=''
          open('/tmp/apply_v2152.py','wb').write(zlib.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply_v2152.py

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'v2.15.2' in text
          assert 'id="weeklySimulation"' in text
          assert 'function renderWeeklySimulation' in text
          assert 'renderWeeklySimulation(matchups,ctx);' in text
          assert 'HEURISTIC VARIANCE v1' in text
          PY
          node --check /tmp/app.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v2152.yml
          git add index.html CHANGELOG.md
          git commit -m "Add weekly simulation"
          git push origin HEAD:main
