name: Apply v2.16 lineup consensus engine

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-v216.yml"
      - "scripts/apply_v216.py"

permissions:
  contents: write

concurrency:
  group: apply-v216
  cancel-in-progress: true

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply v2.16
        run: python scripts/apply_v216.py

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python -c "from pathlib import Path; import re; t=Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>(.*?)</script>',t,flags=re.S); assert s; Path('/tmp/fcc.js').write_text(chr(10).join(s),encoding='utf-8')"
          node --check /tmp/fcc.js

      - name: Semantic checks
        shell: bash
        run: |
          grep -q "MODEL AGREEMENT" index.html
          grep -q "MODEL SPLIT" index.html
          grep -q "lineup consensus check" index.html
          grep -q "v2.16" index.html
          grep -q "## v2.16 — Lineup Consensus Engine" CHANGELOG.md

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Add lineup consensus engine"
          git push origin HEAD:main
