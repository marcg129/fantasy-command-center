name: Verify v2.19.1

on:
  push:
    branches: [feature/v2.19.1-position-aware-routing]
    paths:
      - '.github/workflows/verify-v2.19.1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.19.1-position-aware-routing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Weekly dependency contract
        run: python tests/weekly_contract_test.py
      - name: Streamer to Waiver Planner handoff
        run: python tests/streamer_waiver_handoff_test.py
      - name: Transaction Priority Queue behavior
        run: python tests/weekly_transaction_priority_test.py
      - name: Sleeper integration smoke
        run: python tests/weekly_api_smoke.py
