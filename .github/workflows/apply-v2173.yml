name: Apply v2.17.3 regression test release

on:
  push:
    paths:
      - 'scripts/apply_v2173.py'
      - '.github/workflows/apply-v2173.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2.17.3
        run: python scripts/apply_v2173.py
      - name: Run Weekly contract test
        run: python tests/weekly_contract_test.py
      - name: Commit release metadata
        run: |
          if git diff --quiet -- index.html CHANGELOG.md; then
            echo 'No release metadata changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md
          git commit -m 'Add Weekly regression tests'
          git pull --rebase origin main
          git push
