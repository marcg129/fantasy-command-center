name: Apply v2.17 simulation calibration foundation

on:
  push:
    paths:
      - 'scripts/apply_v217.py'
      - '.github/workflows/apply-v217.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2.17
        run: python scripts/apply_v217.py
      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/update_projections.py scripts/update_calibration.py
      - name: Validate frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/fcc.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/fcc.js
      - name: Semantic checks
        run: |
          grep -F 'v2.17' index.html
          grep -F 'loadProjectionCalibration()' index.html
          grep -F 'CALIBRATION COLLECTING' index.html
          grep -F 'write_calibration_history' scripts/update_projections.py
          grep -F 'MIN_WEEKS = 2' scripts/update_calibration.py
          grep -F 'data/projection-history' .github/workflows/update-projections.yml
          grep -F '## v2.17 — Simulation Calibration Foundation' CHANGELOG.md
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md scripts/update_projections.py scripts/update_calibration.py .github/workflows/update-projections.yml .github/workflows/update-calibration.yml
          git commit -m 'Add simulation calibration foundation'
          git pull --rebase origin main
          git push
