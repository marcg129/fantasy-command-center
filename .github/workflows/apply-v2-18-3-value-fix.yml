name: Apply v2.18.3 Streamer Value Fix

on:
  push:
    branches:
      - feature/v2.18.3-streamer-waiver-handoff
    paths:
      - 'scripts/apply_v2_18_3_value_fix.py'
      - '.github/workflows/apply-v2-18-3-value-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.18.3-streamer-waiver-handoff
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply streamer roster-value fix
        run: python scripts/apply_v2_18_3_value_fix.py
      - name: Run Weekly contract
        run: python tests/weekly_contract_test.py
      - name: Run Streamer waiver handoff contract
        run: python tests/streamer_waiver_handoff_test.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Compute roster value for streamer handoff"
          git push origin HEAD:feature/v2.18.3-streamer-waiver-handoff
