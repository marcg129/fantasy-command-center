name: Apply v2.15.1 weekly navigation

on:
  push:
    paths:
      - ".github/workflows/apply-v2151.yml"

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply v2.15.1
        run: python scripts/apply_v2151.py

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,flags=re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'v2.15.1' in text
          assert 'id="weeklySubnav"' in text
          assert 'function syncWeekToSleeperCurrent' in text
          assert 'function applyWeeklyTab' in text
          assert 'await syncWeekToSleeperCurrent();' in text
          PY
          node --check /tmp/app.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v2151.yml scripts/apply_v2151.py
          git add index.html CHANGELOG.md
          git commit -m "Add weekly navigation"
          git push origin HEAD:main
