name: Apply v2.17.1 simulation confidence guardrails

on:
  push:
    paths:
      - 'scripts/apply_v2171.py'
      - '.github/workflows/apply-v2171.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2.17.1
        run: python scripts/apply_v2171.py
      - name: Validate frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/fcc.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/fcc.js
      - name: Semantic checks
        run: |
          grep -F 'v2.17.1' index.html
          grep -F 'PROVISIONAL • LOW CONFIDENCE' index.html
          grep -F 'NO-ACTION TIE' index.html
          grep -F "decisionThreshold" index.html
          grep -F '## v2.17.1 — Simulation Confidence Guardrails' CHANGELOG.md
      - name: Commit update
        run: |
          if git diff --quiet -- index.html CHANGELOG.md; then
            echo 'No app changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md
          git commit -m 'Add simulation confidence guardrails'
          git pull --rebase origin main
          git push
