name: Apply v2.15 projection foundation

on:
  push:
    paths:
      - ".github/workflows/apply-v215.yml"

permissions:
  contents: write

concurrency:
  group: apply-v215
  cancel-in-progress: false

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "ecfbae4e7db590c6052c82e7d0366f3096a6a4fc"
          test "$(git hash-object CHANGELOG.md)" = "de2ece86ad360f7efa8c421ab11569156d0bc723"

      - name: Apply v2.15 app changes
        shell: bash
        env:
          INDEX_PATCH: 
          CHANGELOG_PATCH: 
        run: |
          echo "$INDEX_PATCH" | base64 -d | gunzip > /tmp/index.patch
          echo "$CHANGELOG_PATCH" | base64 -d | gunzip > /tmp/changelog.patch
          patch -p0 < /tmp/index.patch
          patch -p0 < /tmp/changelog.patch

      - name: Add projection updater
        shell: bash
        env:
          PROJECTION_SCRIPT: 
          PROJECTION_WORKFLOW: 
        run: |
          mkdir -p scripts .github/workflows data
          echo "$PROJECTION_SCRIPT" | base64 -d | gunzip > scripts/update_projections.py
          echo "$PROJECTION_WORKFLOW" | base64 -d | gunzip > .github/workflows/update-projections.yml
          chmod +x scripts/update_projections.py

      - name: Build initial projection snapshot
        shell: bash
        env:
          FALLBACK: H4sIAC3BqWoC/02QQU4DMQxF93MKK2tUlZFgAZdA4gCjKPlMB0wSOTEoqnp34imquvT73/a3zxORW5EgviEuvrkXSsr8YLzC15wGmY/z805+gS+r7+Sl9YLBnGBV9uKuWlYJO35noEDIWrlTkfyJ0Lac6tWpKeag30i2/9bWRLHLhX2HLCFrsmzHO1hHfb7sACJZbNvbbTzV5Es95Ub/5xn78BsjUlTZ0ko/8+HxiSIK524BXqmGE6KaRUscHxmxN2YSNOkHN12mP4jbl/UwAQAA
        run: |
          if ! python scripts/update_projections.py; then
            echo "Projection feed unavailable during deployment; writing retryable placeholder."
            echo "$FALLBACK" | base64 -d | gunzip > data/projections.json
          fi

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY2'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/fcc-v215.js').write_text(chr(10).join(re.findall(r'<script>(.*?)</script>',text,re.S)),encoding='utf-8')
          PY2
          node --check /tmp/fcc-v215.js

      - name: Commit and push v2.15
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md scripts/update_projections.py .github/workflows/update-projections.yml data/projections.json
          git commit -m "Add projection foundation"
          git push origin HEAD:main
