name: Repair v2.15 projection foundation

on:
  push:
    paths:
      - ".github/workflows/repair-v215.yml"

permissions:
  contents: write

concurrency:
  group: repair-v215
  cancel-in-progress: false

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify expected base
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "ecfbae4e7db590c6052c82e7d0366f3096a6a4fc"
          test "$(git hash-object CHANGELOG.md)" = "de2ece86ad360f7efa8c421ab11569156d0bc723"

      - name: Extract and apply v2.15 patches
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path

          source = Path('.github/workflows/apply-v215.yml').read_text(encoding='utf-8')
          for key, dest in [('INDEX_PATCH','/tmp/index.patch'), ('CHANGELOG_PATCH','/tmp/changelog.patch')]:
              match = re.search(rf'^\s*{key}:\s*([A-Za-z0-9+/=]+)\s*$', source, re.M)
              if not match:
                  raise SystemExit(f'Could not extract {key}')
              raw = base64.b64decode(match.group(1), validate=True)
              Path(dest).write_bytes(gzip.decompress(raw))
          PY
          patch -p0 < /tmp/index.patch
          patch -p0 < /tmp/changelog.patch

      - name: Refresh projection snapshot
        shell: bash
        run: python scripts/update_projections.py

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/fcc-v215.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', text, re.S)), encoding='utf-8')
          PY
          node --check /tmp/fcc-v215.js

      - name: Commit and push v2.15
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md data/projections.json
          git commit -m "Add projection foundation"
          git push origin HEAD:main
