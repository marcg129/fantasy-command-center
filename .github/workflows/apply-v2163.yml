name: Apply v2.16.3 median strategy integration

on:
  push:
    paths:
      - "scripts/apply_v2163.py"
      - ".github/workflows/apply-v2163.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v2163
  cancel-in-progress: true

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply v2.16.3
        run: python scripts/apply_v2163.py

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',text,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/fcc-app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/fcc-app.js

      - name: Semantic checks
        shell: bash
        run: |
          grep -q "function renderLeagueMedian(matchups,ctx,simulation=null)" index.html
          grep -q "PREGAME MEDIAN FORECAST" index.html
          grep -q "Beat league median" index.html
          grep -q "Pregame median path" index.html
          grep -q "const simulation=renderWeeklySimulation(matchups,ctx);" index.html
          grep -q "v2.16.3 — Median Strategy Integration" CHANGELOG.md

      - name: Commit update
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- index.html CHANGELOG.md)" ]; then
            echo "No v2.16.3 changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          git commit -m "Integrate league median strategy"
          git push
