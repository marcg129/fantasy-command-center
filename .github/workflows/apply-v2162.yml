name: Apply v2.16.2 current week resolution

on:
  push:
    paths:
      - "scripts/apply_v2162.py"
      - ".github/workflows/apply-v2162.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v2162
  cancel-in-progress: true

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply v2.16.2
        run: python scripts/apply_v2162.py

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          python -c "from pathlib import Path; import re; t=Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>(.*?)</script>',t,flags=re.S); assert s; Path('/tmp/fcc.js').write_text(chr(10).join(s),encoding='utf-8')"
          node --check /tmp/fcc.js

      - name: Semantic checks
        shell: bash
        run: |
          grep -q 'week-aware management • v2.16.2' index.html
          grep -q 'resolveCurrentAnalysisWeek' index.html
          grep -q 'Sleeper state W' index.html
          grep -q '## v2.16.2 — Current Week Resolution' CHANGELOG.md

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Fix current week resolution"
          git push origin HEAD:main
