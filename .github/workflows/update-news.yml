name: Update fantasy news data

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours during the NFL preseason/regular/postseason months.
    # GitHub Actions cron is UTC.
    - cron: "17 */2 * 1,2,8,9,10,11,12 *"

permissions:
  contents: write

concurrency:
  group: fantasy-news-update
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build news JSON
        run: python scripts/update_news.py

      - name: Commit changed news data
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news-data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json
          git commit -m "Refresh fantasy news data"
          git push
