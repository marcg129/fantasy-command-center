name: Apply v2.19.1 position-aware routing

on:
  push:
    branches:
      - feature/v2.19.1-position-aware-routing
    paths:
      - 'scripts/apply_v2_19_1.py'
      - '.github/workflows/apply-v2.19.1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.19.1-position-aware-routing
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2.19.1
        run: python scripts/apply_v2_19_1.py
      - name: Remove temporary updater
        run: |
          rm scripts/apply_v2_19_1.py
          rm .github/workflows/apply-v2.19.1.yml
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CHANGELOG.md tests/weekly_transaction_priority_test.py scripts/apply_v2_19_1.py .github/workflows/apply-v2.19.1.yml
          git commit -m 'Add position-aware transaction routing'
          git push origin HEAD:feature/v2.19.1-position-aware-routing
